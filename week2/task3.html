<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>2주차 · 위성 변환과 카메라</title>
<style>
 html,body{margin:0;height:100%;background:#06090f;color:#c9d6e6;overflow:hidden;
   font:13px/1.65 ui-monospace,Menlo,Consolas,monospace}
 #wrap{display:flex;height:100vh}
 #cv{flex:1;min-width:0;width:auto;height:100%;display:block}
 #panel{width:330px;box-sizing:border-box;padding:14px;background:#0d1420;border-left:1px solid #22303f;overflow-y:auto}
 h1{font-size:15px;margin:0 0 6px;color:#ffd8a0}
 h2{font-size:12px;margin:14px 0 6px;color:#9fc7ff;border-top:1px solid #1d2836;padding-top:8px}
 .ctl{margin:8px 0;font-size:12px}
 .ctl label{display:flex;justify-content:space-between}
 input[type=range]{width:100%}
 pre{font-size:11px;line-height:1.3;background:#0a1119;border:1px solid #22303f;padding:7px;border-radius:6px;color:#9fd0ff;overflow-x:auto}
 .row{display:flex;gap:6px;margin:6px 0} .row button{flex:1}
 button{padding:6px;background:#1b2534;color:#dbe6f3;border:1px solid #2f3d50;border-radius:5px;cursor:pointer;font:inherit}
 button.on{background:#3d6f9e;border-color:#3d6f9e}
 p.note{font-size:12px;color:#93a6bd}
 
</style></head>
<body><div id="wrap"><canvas id="cv"></canvas><aside id="panel"><h1>2-3 위성 변환은 카메라와 무관</h1>
 <p class="note">달의 세계 행렬은 <b>행성의 이동·회전 × 달의 공전</b>으로만 결정됩니다.
  카메라(뷰 행렬)를 아무리 돌려도 달의 모델 행렬은 변하지 않습니다.</p>
 <div class="ctl"><label>행성 자전 <span id="pVal">30°</span></label><input id="p" type="range" min="0" max="360" step="1" value="30"></div>
 <div class="ctl"><label>달 공전 각 <span id="oVal">120°</span></label><input id="o" type="range" min="0" max="360" step="1" value="120"></div>
 <div class="ctl"><label>카메라 방위(뷰만 변경) <span id="cVal">40°</span></label><input id="c" type="range" min="0" max="360" step="1" value="40"></div>
 <h2>달의 모델 행렬 (카메라와 무관)</h2><pre id="mMoon"></pre>
 <h2>카메라 방위를 바꾼 뒤의 값</h2><pre id="same"></pre>
 <p class="note">두 값이 같으면 “위성 변환은 카메라와 무관”이 확인됩니다.
  자전을 크게 돌려도 달의 위치는 공전 각으로만 정해집니다.</p></aside></div>
<script src="../src/mesh.js"></script><script src="common.js"></script>
<script>
(() => {
  const M = CGW.M, cv = document.querySelector('#cv');
  const R = CGW.make(cv); if (!R) return;
  const S = { spin: 30, orbit: 120, camYaw: 40 };
  const cam = { yaw: 40*Math.PI/180, pitch: 0.35, dist: 9, target: [0, 0.9, 0], onChange: () => { S.camYaw = cam.yaw*180/Math.PI; document.querySelector('#c').value = String(Math.round(((S.camYaw%360)+360)%360)); document.querySelector('#cVal').textContent = Math.round(((S.camYaw%360)+360)%360)+'°'; draw(); } };
  CGW.orbit(cv, cam);

  function bind(id, key, fmt, out){
    const el = document.querySelector('#'+id), lab = document.querySelector('#'+out);
    el.addEventListener('input', () => {
      if (key === 'camYaw'){ cam.yaw = Number(el.value)*Math.PI/180; lab.textContent = el.value+'°'; draw(); return; }
      S[key] = Number(el.value); lab.textContent = fmt(S[key]); draw();
    });
  }
  bind('p','spin', v => v+'°','pVal');
  bind('o','orbit', v => v+'°','oVal');
  bind('c','camYaw', v => v+'°','cVal');

  let moonMatrixKey = '';

  function draw(){
    const planetT = M.translate(0, 1.2, 0);
    const planetR = M.rotateY(S.spin*Math.PI/180);
    const planetM = M.multiply(planetT, planetR);
    const moonM = M.multiply(M.multiply(planetT, M.rotateY(S.orbit*Math.PI/180)), M.translate(2.6,0,0));
    const moonScaled = M.multiply(moonM, M.scale(0.34,0.34,0.34));
    const moonKey = CGW.fmt(moonM);

    const items = [
      { model: M.multiply(M.translate(0,-0.02,0), M.multiply(M.rotateX(Math.PI/2), M.scale(12,12,12))),
        color: [0.26,0.30,0.37], quad: true, flat: true },
      { model: M.multiply(planetM, M.scale(1.0,1.0,1.0)), color: [0.85,0.50,0.30] },
      { model: moonScaled, color: [0.78,0.78,0.82] },
    ];
    R.draw(items, { eye: CGW.eyeOf(cam), target: cam.target, fov: 45 });

    document.querySelector('#mMoon').textContent = moonKey;
    document.querySelector('#same').textContent =
      '모델 행렬(카메라 방위 ' + Math.round(((S.camYaw%360)+360)%360) + '° 에서 다시 읽음)\n' + moonKey +
      '\n\n→ 두 값이 ' + (moonKey === moonMatrixKey ? '동일' : '다름') + ' : 카메라 회전은 모델 행렬에 영향을 주지 않는다.';
    moonMatrixKey = moonKey;
  }
  draw();
})();
</script>
</body></html>
