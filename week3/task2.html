<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3주차 실습 2 · 살아 있는 행성</title>
<style>
  html, body { margin: 0; height: 100%; background: #06090f; color: #c9d6e6; overflow: hidden;
               font: 13px/1.6 ui-monospace, Menlo, Consolas, monospace; }
  #wrap { display: flex; height: 100vh; }
  canvas { flex: 1; min-width: 0; height: 100%; display: block; }
  #panel { width: 290px; box-sizing: border-box; padding: 14px; background: #0d1420;
           border-left: 1px solid #22303f; overflow-y: auto; }
  h1 { font-size: 15px; margin: 0 0 8px; color: #ffd8a0; }
  .ctl { margin: 10px 0; font-size: 12px; }
  .ctl label { display: flex; justify-content: space-between; }
  input[type=range] { width: 100%; }
  pre#mat { font-size: 11px; background: #0a1119; border: 1px solid #22303f; padding: 8px;
            border-radius: 6px; color: #9fd0ff; overflow-x: auto; }
  button { padding: 6px 8px; background: #1b2534; color: #dbe6f3; border: 1px solid #2f3d50;
           border-radius: 5px; cursor: pointer; font: inherit; margin-right: 4px; }
  button.on { background: #3d6f9e; border-color: #3d6f9e; }
  p.note { font-size: 12px; color: #93a6bd; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <aside id="panel">
    <h1>3주차 실습 2 · 살아 있는 행성</h1>
    <p class="note">두 행성이 <b>같은 셰이더 하나</b>를 쓰고, uniform(uTint·uKind·uSpin·uSize)만 달라
      서로 다른 행성으로 보입니다. uTime 이 자전·공전을 진행시키고, 태양 방향과의 내적이
      낮/밤 경계를 만듭니다.</p>
    <div class="ctl"><label>시간 <span id="tVal">0.0 s</span></label>
      <input id="time" type="range" min="0" max="120" step="0.1" value="0"></div>
    <div class="ctl"><label>시간 배속 <span id="sVal">1.0×</span></label>
      <input id="speed" type="range" min="0" max="4" step="0.05" value="1"></div>
    <div class="ctl"><label>행성 A 자전 <span id="raVal">1.0×</span></label>
      <input id="spinA" type="range" min="0" max="3" step="0.05" value="1"></div>
    <div class="ctl"><label>행성 B 자전 <span id="rbVal">0.4×</span></label>
      <input id="spinB" type="range" min="0" max="3" step="0.05" value="0.4"></div>
    <div class="ctl"><button id="pause">일시정지</button><button id="reset">시간 0</button></div>
    <div class="ctl"><label>모델 행렬(행성 A, 열 우선)</label><pre id="mat"></pre></div>
    <p class="note">밤면은 확산광이 0 이 되어 어두워지고, 경계(터미네이터)가 부드럽게 보간됩니다.
      두 행성의 색·줄무늬·자전 속도가 모두 uniform 으로만 갈리므로 셰이더는 하나입니다.</p>
  </aside>
</div>
<script src="../src/mesh.js"></script>
<script src="task2.js"></script>
</body>
</html>
